<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여과시간 게이트웨이</title>
<style>
  /* 데모 화면(index.html)과 같은 흑백. 상태는 색 대신 테두리·반전으로 구분한다. */
  :root {
    --ink: #000; --paper: #fff; --g1: #f4f4f4; --g2: #d9d9d9; --g3: #8a8a8a; --g4: #555;
    --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, "D2Coding", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); overflow-x: hidden; }
  body { font-family: var(--sans); font-size: 15px; line-height: 1.55; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; display: grid; gap: 24px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
           border-bottom: 3px solid var(--ink); padding-bottom: 12px; }
  h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -0.02em; }
  h2 { margin: 0 0 10px; font-size: 17px; }
  .sub { color: var(--g4); font-size: 14px; }
  .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=text], textarea { font: inherit; border: 1.5px solid var(--ink); background: var(--paper); padding: 6px 8px; }
  textarea { width: 100%; height: 150px; font-family: var(--mono); font-size: 12px; }
  button { font: inherit; font-weight: 700; border: 2px solid var(--ink); background: var(--paper); padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--ink); color: var(--paper); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, tr:focus-visible { outline: 3px solid var(--g3); outline-offset: 2px; }
  .grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card { border: 1.5px solid var(--ink); padding: 16px; display: grid; gap: 10px; min-width: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .muted { color: var(--g4); font-size: 13px; }
  .err { border: 2px solid var(--ink); background: var(--g1); padding: 8px 10px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--g2); }
  th { font-size: 12px; color: var(--g4); font-weight: 500; }
  tbody tr { cursor: pointer; }
  tbody tr.sel { background: var(--g1); }
  .st { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--ink); white-space: nowrap; }
  .st.SENT { background: var(--ink); color: var(--paper); }
  .st.REJECTED, .st.SEND_FAILED { border-style: dashed; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 13.5px; }
  .kv dt { color: var(--g4); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
  pre { margin: 0; background: var(--g1); padding: 10px; font-family: var(--mono); font-size: 11.5px; max-height: 320px;
        overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  mark { background: var(--ink); color: var(--paper); }
  .audit { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
  .audit li { display: grid; grid-template-columns: 70px 120px minmax(0, 1fr); gap: 8px; border-left: 3px solid var(--ink); padding-left: 8px; }
  .audit b { font-family: var(--mono); font-size: 12px; }
  details summary { cursor: pointer; font-size: 13px; color: var(--g4); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>여과시간 게이트웨이</h1>
      <div class="sub">장애 로그 → 목록 10칸만 담은 파생본 → 다른 사람의 승인 → 등록된 AI 한 곳으로만</div>
    </div>
    <div class="who">
      <span>로그인: <b id="who">…</b></span>
      <span id="roles" class="muted"></span>
      <button id="logout" type="button">로그아웃</button>
      <a href="/" class="muted">실험 데모</a>
    </div>
  </header>

  <div id="err" class="err" hidden></div>

  <div class="grid">
    <div style="display:grid; gap:24px; min-width:0">
      <section class="card" id="createCard">
        <h2>① 요청 만들기</h2>
        <div class="row">
          <label for="sample" class="muted">샘플</label>
          <select id="sample"><option value="">직접 붙여 넣기</option></select>
          <input type="file" id="file" accept=".jsonl,.json,.txt">
        </div>
        <textarea id="log" placeholder="장애 구간의 OTel 로그(JSONL)를 붙여 넣거나 파일을 고르세요."></textarea>
        <div class="row">
          <button class="primary" id="createBtn">파생본 만들기</button>
          <span class="muted">원문은 저장하지 않고 해시와 레코드 수만 남습니다.</span>
        </div>
      </section>

      <section class="card">
        <div class="row" style="justify-content:space-between">
          <h2 style="margin:0">요청 목록</h2>
          <select id="filter" aria-label="상태 거르기">
            <option value="">전체</option><option value="PREPARED">승인 대기</option><option value="SENT">전송 완료</option>
            <option value="REJECTED">반려</option><option value="SEND_FAILED">전송 실패</option>
          </select>
        </div>
        <table>
          <thead><tr><th>요청</th><th>상태</th><th>요청자</th><th>필드</th><th>경고</th></tr></thead>
          <tbody id="list"><tr><td colspan="5" class="muted">아직 요청이 없습니다. 위에서 로그를 올려 파생본을 만드세요.</td></tr></tbody>
        </table>
      </section>
    </div>

    <section class="card" id="detail">
      <h2>② 파생본 확인 · ③ 승인 · ④ 결과와 감사 기록</h2>
      <p class="muted">목록에서 요청을 고르면 여기에 실제로 나갈 내용이 보입니다.</p>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STATUS = { PREPARED: "승인 대기", APPROVED: "승인됨", SENT: "전송 완료", REJECTED: "반려", SEND_FAILED: "전송 실패" };
// 서버(GatewayService.WARNING_PATTERNS)와 같은 패턴. 파생본을 바꾸지 않고 강조만 한다.
const WARN = [/[\w.+-]+@[\w-]+\.[\w.-]+/g, /\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b/g,
              /\b(?:\d{4}[ -]){3}\d{1,4}\b|\b\d{13,16}\b/g, /\b(?:\d{1,3}\.){3}\d{1,3}\b/g];
let me = { user: "", roles: [] };
let current = null;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const user = () => me.user;
const roles = () => me.roles;
// 로그인 세션 + CSRF: 상태를 바꾸는 요청에는 XSRF-TOKEN 쿠키 값을 헤더로 보낸다
const xsrf = () => decodeURIComponent((document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/) || [])[1] || "");

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": xsrf(), ...(opts.headers || {}) } });
  if (res.status === 401) { location.href = "/login"; throw new Error("로그인이 필요합니다."); }
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (!res.ok) throw new Error(`${res.status} · ${body?.detail || res.statusText}`);
  return body;
}
function showErr(e) { $("err").hidden = !e; $("err").textContent = e ? e.message : ""; }

function highlight(text) {
  let html = esc(text);
  for (const re of WARN) html = html.replace(re, (m) => `<mark>${m}</mark>`);
  return html;
}

async function loadList() {
  const rows = await api("/api/requests" + ($("filter").value ? "?status=" + $("filter").value : ""));
  $("list").innerHTML = rows.length ? rows.map((r) => `
    <tr tabindex="0" data-id="${r.id}" class="${current === r.id ? "sel" : ""}">
      <td>${r.id}</td><td><span class="st ${r.status}">${STATUS[r.status]}</span></td><td>${esc(r.requester)}</td>
      <td>${r.fieldsBefore} → ${r.fieldsAfter}</td><td>${r.warnings.reduce((a, w) => a + w.count, 0)}</td></tr>`).join("")
    : `<tr><td colspan="5" class="muted">해당하는 요청이 없습니다.</td></tr>`;
  for (const tr of $("list").querySelectorAll("tr[data-id]")) {
    tr.onclick = () => open(tr.dataset.id);
    tr.onkeydown = (e) => { if (e.key === "Enter") open(tr.dataset.id); };
  }
}

async function open(id) {
  current = id;
  showErr(null);
  const [d, audit] = await Promise.all([api("/api/requests/" + id), api(`/api/requests/${id}/audit`)]);
  const canDecide = d.status === "PREPARED" && roles().includes("APPROVER") && d.requester !== user();
  const why = d.status !== "PREPARED" ? "이미 결정된 요청입니다." : !roles().includes("APPROVER") ? "승인자 권한이 없습니다."
            : d.requester === user() ? "자기 요청은 승인할 수 없습니다. 다른 승인자 계정으로 로그인해 보세요." : "";
  const warn = d.warnings.length ? d.warnings.map((w) => `${w.type} ${w.count}`).join(" · ") : "없음";
  $("detail").innerHTML = `
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${d.id}</h2><span class="st ${d.status}">${STATUS[d.status]}</span></div>
    <dl class="kv">
      <dt>요청자 → 승인자</dt><dd>${esc(d.requester)} → ${esc(d.approver || "—")}</dd>
      <dt>원문</dt><dd>레코드 ${d.inputRecords}건 · 해시 ${d.inputSha256.slice(0, 16)}… (원문은 저장 안 함)</dd>
      <dt>파생본</dt><dd>레코드 ${d.records}건 · 필드 ${d.fieldsBefore} → ${d.fieldsAfter} · 해시 ${d.packageSha256.slice(0, 16)}…</dd>
      <dt>목록 버전</dt><dd>${d.listVersion} (${esc(d.purpose)})</dd>
      <dt>전송 대상</dt><dd>${esc(d.endpointId)} (등록된 대상만)</dd>
      <dt>승인 지문</dt><dd>${d.fingerprint ? d.fingerprint.slice(0, 16) + "…" : "—"}</dd>
      <dt>참고 경고</dt><dd>${warn}</dd>
    </dl>
    <div><div class="muted">실제로 나갈 내용 (앞 ${d.previewRecords}건 / 전체 ${d.records}건, 검게 칠한 곳은 참고 경고)</div><pre>${highlight(d.preview)}</pre></div>
    <details><summary>버려진 필드 ${d.droppedFields.length}개</summary><pre>${esc(d.droppedFields.join("\n"))}</pre></details>
    <div class="row">
      <button class="primary" id="approveBtn" ${canDecide ? "" : "disabled"}>승인하고 전송</button>
      <input type="text" id="reason" placeholder="반려 사유" aria-label="반려 사유" ${canDecide ? "" : "disabled"}>
      <button id="rejectBtn" ${canDecide ? "" : "disabled"}>반려</button>
      <span class="muted">${why}</span>
    </div>
    ${d.comment ? `<div class="muted">사유: ${esc(d.comment)}</div>` : ""}
    ${d.answer ? `<div><div class="muted">AI 답 (${esc(d.model)} · ${esc(d.answerMode)})</div><pre>${esc(d.answer)}</pre></div>` : ""}
    <div><div class="muted">감사 기록 (추가만 가능)</div><ul class="audit">${audit.map((a) => `
      <li><span>${new Date(a.at).toLocaleTimeString("ko-KR")}</span><b>${esc(a.type)}</b><span>${esc(a.actor)} · ${esc(a.detail)}</span></li>`).join("")}</ul></div>`;
  $("approveBtn").onclick = () => decide(true, d.packageSha256);
  $("rejectBtn").onclick = () => decide(false, d.packageSha256);
  loadList();
}

async function decide(approve, sha) {
  try {
    $("approveBtn").disabled = $("rejectBtn").disabled = true;
    $("approveBtn").textContent = approve ? "전송 중…" : $("approveBtn").textContent;
    await api(`/api/requests/${current}/decision`, { method: "POST",
      body: JSON.stringify({ approve, comment: $("reason").value, packageSha256: sha }) });
    await open(current);
  } catch (e) { showErr(e); await open(current).catch(() => {}); showErr(e); }
}

$("createBtn").onclick = async () => {
  try {
    showErr(null);
    $("createBtn").disabled = true;
    const r = await api("/api/requests", { method: "POST", body: JSON.stringify({ log: $("log").value }) });
    await open(r.id);
  } catch (e) { showErr(e); } finally { $("createBtn").disabled = false; }
};
$("sample").onchange = async () => {
  if (!$("sample").value) return;
  try { $("log").value = (await api("/api/sample/" + $("sample").value)).log; } catch (e) { showErr(e); }
};
$("file").onchange = async () => { const f = $("file").files[0]; if (f) $("log").value = await f.text(); };
$("filter").onchange = () => loadList().catch(showErr);
$("logout").onclick = async () => {
  await fetch("/logout", { method: "POST", headers: { "X-XSRF-TOKEN": xsrf() } }).catch(() => {});
  location.href = "/login?logout";
};

(async () => {
  try {
    me = await api("/api/gateway/me");
    $("who").textContent = me.user;
    $("roles").textContent = me.roles.join(", ");
    $("createCard").hidden = !roles().includes("REQUESTER");
    const samples = (await api("/api/meta")).samples || [];
    $("sample").innerHTML += samples.map((s) => `<option>${esc(s)}</option>`).join("");
    await loadList();
  } catch (e) { showErr(e); }
})();
</script>
</body>
</html>
