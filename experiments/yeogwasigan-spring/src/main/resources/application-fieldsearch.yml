# 필드 탐색 (AI 확인 단계) 프로파일: FieldSearchRunner 만 실행하고 종료한다.
#   scripts/fieldsearch.sh                         # 1단계 → 2·3단계 한 번에 (.env 의 키로 live)
#   YG_AI_MOCK=true scripts/fieldsearch.sh         # 비용 없이 파이프라인만 확인
# 장애 폴더 · 고르는/검증 장애 목록은 1단계가 쓴 후보 파일에 들어 있다. 정답 원인은 장애 폴더의 truth.yaml.
spring:
  main:
    web-application-type: none

yeogwasigan:
  fieldsearch:
    candidates-file: data/fieldsearch_candidates.json
    max-candidates: 15
    # 1차에서 원인 단서가 한 번도 없던 칸은 AI 로 확인하지 않는다 (비용 1/3, 10/27 결정)
    min-clue: 1
