plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.capstone'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 데모 + RestClient(Presidio·외부 AI 호출) + Jackson + SnakeYAML
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 결과 CSV 읽기/쓰기 (AI 응답에 줄바꿈·쉼표·따옴표가 섞여도 안전하게)
    implementation 'org.apache.commons:commons-csv:1.12.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17          // JDK 21 등 더 높은 버전으로 빌드해도 Java 17 바이트코드로 고정
}

// 실행 가능한 jar 하나만 만든다 (Dockerfile 에서 build/libs/*.jar 로 복사)
jar {
    enabled = false
}

bootRun {
    // 한글이 섞인 로그·YAML 을 OS 기본 인코딩과 무관하게 UTF-8 로 처리
    jvmArgs = ['-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8']
    // scenarios/, results/ 를 프로젝트 루트 기준 상대경로로 찾는다
    workingDir = projectDir
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}
