# 주입한 민감정보 목록 — core/scoring/ResidualScorer 가 이 값들을 결과물에서 문자열 검색으로 센다.
#
# 규칙
# - value     : 결과물(= AI로 실제 전송되는 텍스트)에서 그대로 검색할 원본 문자열
# - locations : 원본 raw.jsonl 에서의 위치 (line 은 1부터). 채점에는 쓰이지 않고 설명·검증용
# - kind      : 구조화 필드(키 이름으로 분류 가능) / 자유텍스트 안(키 이름으로 분류 불가 → innerScan 필요)
#
# 의도한 관찰 포인트
# - PERSON_NAME(한글 이름), ACCOUNT_NUMBER(국내 계좌 형식)는 Presidio 기본 인식기가
#   못 잡을 가능성이 높다 → [B] 빼기의 실제 한계를 측정
# - body 자유텍스트 안의 이메일·계좌·이름 → [C] 담기에서 innerScan 이 필요한 이유
#   (정규식 innerScan 도 한글 이름은 못 잡는다 → [C]의 한계도 함께 측정됨)
